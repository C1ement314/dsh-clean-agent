  <path d="M15 31 L12.5 33.5 M18 34 L15.5 37 M23 24 L18 29" stroke="#0f172a" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
  <!-- sparkles -->
  <path d="M36 22 L36 28 M33 25 L39 25" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M13 12 L13 16 M11 14 L15 14" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <circle cx="37.5" cy="35.5" r="1.4" fill="#67e8f9" opacity="0.85"/>
