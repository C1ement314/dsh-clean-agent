<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Cleanup Mode">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a37"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="11.5" fill="none" stroke="#2dd4bf" stroke-opacity="0.35"/>
  <!-- handle -->
  <path d="M34 10 L25 19" stroke="#e2e8f0" stroke-width="3.2" stroke-linecap="round"/>
  <!-- collar -->
